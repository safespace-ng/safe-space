<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7faf8">
<title>Safe Space</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7faf8;--card:#fff;--ink:#23353a;--mute:#5d7075;--teal:#1b6b6b;--line:#dfe9e6;--c1:#dcefec;--c2:#fbe9d6;--c3:#e8e1f3;--i1:#1b6b6b;--i2:#c27a42;--i3:#7d63a8;--me:#1b6b6b;--meink:#fff;--bot:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#10191b;--card:#17252a;--ink:#e6f0ee;--mute:#9bb0b0;--teal:#6cc3bd;--line:#26393d;--c1:#173a3a;--c2:#3b2d1d;--c3:#2a2540;--i1:#6cc3bd;--i2:#e8a46c;--i3:#b9a2e6;--me:#2c8f8a;--bot:#1d2e33}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
main{flex:1;overflow-y:auto;padding:20px 18px}
h1,h2{font-family:"DM Serif Display",Georgia,serif;font-weight:400;color:var(--teal);margin:0}
.top{text-align:center}.top h1{font-size:2.3rem}.top p{margin:2px 0 0;color:var(--mute);font-size:.95rem}
.hero{display:block;width:100%;max-width:340px;margin:8px auto 0}
.welcome{text-align:center;font-size:1.25rem;font-weight:600;margin:4px 0 18px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(30,60,60,.08)}
.opt .ic{flex:none;width:52px;height:52px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.opt b{display:block;font-size:1.1rem}.opt span{font-size:.9rem;color:var(--mute)}.opt .go{margin-left:auto;font-size:1.4rem}
.o1{background:var(--c1)}.o1 b,.o1 .go{color:var(--i1)}.o2{background:var(--c2)}.o2 b,.o2 .go{color:var(--i2)}.o3{background:var(--c3)}.o3 b,.o3 .go{color:var(--i3)}
.priv{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:6px;font-size:.88rem;color:var(--mute)}.priv b{display:block;color:var(--ink)}
nav{display:flex;border-top:1px solid var(--line);background:var(--card)}
nav button{flex:1;border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;color:var(--mute);border-top:3px solid transparent}
nav button[aria-current="page"]{color:var(--teal);font-weight:700;border-top-color:var(--teal)}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}.hd h2{font-size:1.6rem}
.back{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 12px}
.chat{display:flex;flex-direction:column;height:100%}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 0 12px}
.m{max-width:82%;padding:10px 14px;border-radius:18px;background:var(--bot);border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--me);color:var(--meink);border-color:transparent}
.m.sys{align-self:center;max-width:100%;background:var(--c1);font-size:.9rem;text-align:center}
.m.care{background:var(--c2)}
.mode{font-size:.85rem;color:var(--mute);margin:-8px 0 10px}
.send{display:flex;gap:8px}
.send textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:16px;padding:10px 14px;background:var(--card);color:var(--ink);font:inherit;max-height:120px}
.send button{border:0;background:var(--teal);color:var(--bg);border-radius:16px;padding:0 18px;font-weight:700}
.send :disabled{opacity:.5}
.note{font-size:.8rem;color:var(--mute);text-align:center;margin:8px 0 0}
.row{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.row small{color:var(--mute)}.chip{font-size:.72rem;border-radius:99px;padding:1px 8px;background:var(--c3);margin-left:6px}.chip.w{background:var(--c2)}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:1.05rem}.card p{margin:0;color:var(--mute);font-size:.92rem}
input{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--card);color:var(--ink);font:inherit}
.btn{border:0;background:var(--teal);color:var(--bg);border-radius:12px;padding:10px 16px;font-weight:700;margin-top:6px}.btn.alt{background:none;color:var(--teal);border:1px solid var(--teal)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:12px;display:none;max-width:90%;z-index:9}
@media(min-width:900px){.app{max-width:1000px;flex-direction:row-reverse;border:0 solid var(--line);border-width:0 1px}
nav{flex-direction:column;width:210px;border-top:0;border-left:1px solid var(--line);padding:18px 10px;justify-content:flex-start;gap:6px}
nav button{flex:none;flex-direction:row;gap:10px;font-size:1rem;padding:12px 14px;border-top:0;border-radius:12px}nav button[aria-current="page"]{background:var(--c1)}
main{padding:28px 36px}#home{max-width:560px;margin:0 auto}}
.m:not(.sys){padding-right:30px}.m{position:relative}
.m .qt{font-size:.82rem;opacity:.85;border-left:3px solid var(--teal);padding:2px 8px;margin-bottom:4px;background:rgba(127,127,127,.18);border-radius:6px}
.m .mb{position:absolute;top:2px;right:6px;border:0;background:none;opacity:.5;font-size:1.05rem;padding:2px 4px}
.m i{opacity:.7}.m small{display:block;font-size:.7rem;opacity:.65;margin-top:2px}
.bar{display:flex;align-items:center;gap:8px;background:var(--c1);border-radius:12px;padding:6px 10px;margin-bottom:6px;font-size:.85rem}
.bar[hidden]{display:none}.bar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar button{border:0;background:none;font-size:1.1rem}
.endb{margin-left:auto;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 10px;font-size:.8rem;color:var(--mute)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet>div{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:8px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.sheet button{display:block;width:100%;text-align:left;border:0;background:none;padding:14px 8px;font-size:1.05rem;border-bottom:1px solid var(--line)}
.sheet button.d{color:#d9534f}
.rw{display:flex;gap:8px;margin-bottom:10px}.rw .row{margin:0;flex:1}.rm{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:0 12px;color:var(--mute)}
@media(pointer:coarse){.m{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 4px;font-size:.85rem}
.tab.on{background:var(--teal);color:var(--bg);border-color:var(--teal);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.chip2{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px;font-size:.8rem;white-space:nowrap}
.chip2.on{border-color:var(--teal);font-weight:700}
.chip2.m-talk,.chip.m-talk{background:var(--c1)}.chip2.m-listen,.chip.m-listen{background:var(--c2)}.chip2.m-advice,.chip.m-advice{background:var(--c3)}
.need{color:#d9534f;font-weight:700;font-size:.78rem;margin-left:8px}
.pv{color:var(--mute);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div class="app"><nav id="nav" aria-label="Main"></nav><main id="main" tabindex="-1"></main></div>
<div id="toast" role="status"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInAnonymously,signInWithEmailAndPassword,signOut,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
import {getFirestore,collection,doc,addDoc,updateDoc,query,where,orderBy,limit,getDocs,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyC2EqQPDFlLx0c9puSqmPI6t_UFwQeGVPo",authDomain:"safe-space-8fd09.firebaseapp.com",projectId:"safe-space-8fd09",storageBucket:"safe-space-8fd09.firebasestorage.app",messagingSenderId:"656666751314",appId:"1:656666751314:web:24f07c6c5caf0f7384ca8b"});
const auth=getAuth(app);
const cands=[getFirestore(app),getFirestore(app,"default")];
let db=cands[0],dbReady=false;

const MODES={
 talk:{name:"I Need to Talk",sub:"For someone who needs to talk and be heard.",guide:"Reflect back and ask gentle, open questions."},
 listen:{name:"Just Listen, Please",sub:"For someone who wants to vent, with no advice.",guide:"Only listen. Do not give advice."},
 advice:{name:"Talk + Advice",sub:"For someone who wants guidance and support.",guide:"Listen first, then offer gentle guidance."}
};
const CARE="We're concerned about your safety. This space can't replace urgent help. If you might act on these thoughts, please contact your local emergency number or a crisis line now, or reach someone you trust and stay with them. You deserve support.";
const RISK=/suicid|kill myself|end my life|hurt myself|self.?harm|want to die/i;
const TABS=[["home","Home"],["sessions","My Sessions"],["resources","Resources"],["profile","Profile"]];

const $=s=>document.querySelector(s),main=$("#main");
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
let me=null,isListener=false,view="home",cur=null,subs=[];
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",8000)};
const when=ts=>ts&&ts.toDate?ts.toDate().toLocaleString([],{dateStyle:"medium",timeStyle:"short"}):"just now";
const listen=(q,ok,err)=>{subs.push(onSnapshot(q,ok,err||(e=>toast("Connection problem. Please try again."))))};

function pickDb(){
 let c;try{c=localStorage.getItem("ss_db")}catch(e){}
 if(c==="0"||c==="1")return Promise.resolve(cands[+c]);
 return new Promise(res=>{
  cands.forEach((d,i)=>getDocs(query(collection(d,"listeners"),limit(1))).catch(e=>{
   if(e.code==="permission-denied"){try{localStorage.setItem("ss_db",String(i))}catch(x){}res(d)}}));
  setTimeout(()=>res(cands[0]),8000);
 });
}
const dbPromise=pickDb();
let setReady;const ready=new Promise(r=>setReady=r);
async function checkListener(){
 try{await getDocs(query(collection(db,"conversations"),limit(1)));isListener=true}catch(e){isListener=false}
 return isListener;
}
onAuthStateChanged(auth,async u=>{
 if(!u){signInAnonymously(auth).catch(()=>toast("Could not connect."));return}
 db=await dbPromise;
 if(u.email)await checkListener();else isListener=false;
 me=u.uid;setReady();render();
});

function nav(){
 const n=$("#nav");n.innerHTML="";
 const tabs=isListener?[["inbox","Inbox"],...TABS]:TABS;
 tabs.forEach(([v,l])=>{const b=el("button",null,l);b.dataset.v=v;if(v===view)b.setAttribute("aria-current","page");b.onclick=()=>go(v);n.appendChild(b)});
}
function go(v){view=v;render()}
function render(){
 if(view==="chat"&&!(history.state&&history.state.chat))history.pushState({chat:1},"");
 subs.forEach(u=>u());subs=[];nav();main.innerHTML="";
 if(!me&&view!=="home"&&view!=="chat"){main.appendChild(el("p","empty","Connecting…"));return}
 ({home,chat,sessions,resources,profile,inbox})[view]();
 main.scrollTop=0;
}

const hero=`<svg class="hero" viewBox="0 0 340 220" role="img" aria-label="Two people sitting together in a soft glow"><defs><radialGradient id="g" cx="50%" cy="55%" r="55%"><stop offset="0" stop-color="#fff6d8" stop-opacity=".95"/><stop offset="1" stop-color="#e5f2ee" stop-opacity="0"/></radialGradient></defs><ellipse cx="170" cy="115" rx="120" ry="100" fill="url(#g)" stroke="#fff" stroke-opacity=".8" stroke-width="2"/><g fill="#9fc4b5"><circle cx="128" cy="68" r="17"/><path d="M104 190c-8-40-2-92 24-100 20 6 30 40 30 100z"/></g><g fill="#b8a9d9"><circle cx="212" cy="76" r="16"/><path d="M186 190c0-60 6-94 26-100 24 8 32 56 22 100z"/></g><circle cx="170" cy="168" r="10" fill="#fff3b8" opacity=".9"/><g fill="#9fc4b5" opacity=".75"><path d="M40 190c-6-40 6-80 30-100 8 36 0 76-30 100z"/></g><g fill="#b8a9d9" opacity=".75"><path d="M300 190c6-40-6-80-30-100-8 36 0 76 30 100z"/></g></svg>`;
const ic={talk:"💬",listen:"👂",advice:"🌿"};

function home(){
 const d=el("div");d.id="home";
 d.innerHTML=`<div class="top"><h1>Safe Space <span style="font-size:1.6rem">♥</span></h1><p>A safe space to be heard, understood, and supported.</p></div>${hero}<p class="welcome">You don't have to figure everything out alone.</p>`;
 [["talk","o1"],["listen","o2"],["advice","o3"]].forEach(([k,c])=>{
  const b=el("button","opt "+c);
  b.innerHTML=`<span class="ic" style="font-size:1.5rem">${ic[k]}</span><span><b>${MODES[k].name}</b><span>${MODES[k].sub}</span></span><span class="go" aria-hidden="true">›</span>`;
  b.onclick=()=>start(k,b);d.appendChild(b);
 });
 const p=el("div","priv");
 p.innerHTML=`<span style="font-size:1.6rem" aria-hidden="true">🛡️</span><span><b>Your privacy matters.</b>Your conversations are handled with care and respect.</span>`;
 d.appendChild(p);main.appendChild(d);
}
function start(mode){cur={id:null,mode,role:"user",from:view};view="chat";render()}

function chat(){
 const m=MODES[cur.mode],isL=cur.role==="listener",coarse=matchMedia("(pointer:coarse)").matches;
 const w=el("div","chat"),hd=el("div","hd"),back=el("button","back","‹ Back"),endb=el("button","endb","End chat");
 back.onclick=()=>{const to=cur.from||(isL?"inbox":"home");if(history.state&&history.state.chat)history.back();else go(to)};
 hd.append(back,el("h2",null,m.name),endb);endb.hidden=!cur.id;
 const sub=el("p","mode",isL?"Guide: "+m.guide:m.sub);
 const box=el("div","msgs");box.setAttribute("aria-live","polite");
 const bar=el("div","bar");bar.hidden=true;
 const f=el("div","send"),ta=el("textarea");ta.rows=2;ta.maxLength=2000;ta.placeholder="Write here…";ta.setAttribute("aria-label","Your message");
 const sb=el("button",null,"Send");f.append(ta,sb);
 const foot=el("div","note");
 let status="waiting",reply=null,editing=null,last=[],sending=false;
 const cref=()=>doc(db,"conversations",cur.id),mref=id=>doc(db,"conversations",cur.id,"messages",id);
 const setBar=()=>{
  bar.hidden=!(reply||editing);bar.innerHTML="";sb.textContent=editing?"Save":"Send";
  if(!bar.hidden){
   const t=editing||reply,x=el("button",null,"✕");x.setAttribute("aria-label","Cancel");
   x.onclick=()=>{if(editing)ta.value="";reply=editing=null;setBar()};
   bar.append(el("span",null,(editing?"Editing: ":"Replying to: ")+t.text.slice(0,80)),x);
  }
 };
 const startReply=d=>{reply={id:d.id,text:d.data().text};editing=null;setBar();ta.focus()};
 const startEdit=d=>{editing={id:d.id,text:d.data().text};reply=null;ta.value=editing.text;setBar();ta.focus()};
 const del=async d=>{if(confirm("Delete this message for everyone?"))try{await updateDoc(mref(d.id),{text:"",deleted:true})}catch(e){toast("Could not delete.")}};
 const openMenu=d=>{
  const x=d.data(),mine=x.senderId===me,live=!x.deleted&&status!=="ended";
  const sh=el("div","sheet"),panel=el("div");
  const add=(t,fn,c)=>{const b=el("button",c||"",t);b.onclick=()=>{sh.remove();if(fn)fn()};panel.appendChild(b)};
  if(live)add("Reply",()=>startReply(d));
  if(!x.deleted)add("Copy",()=>{try{navigator.clipboard.writeText(x.text)}catch(e){}});
  if(live&&mine)add("Edit",()=>startEdit(d));
  if(live&&mine)add("Delete",()=>del(d),"d");
  add("Cancel");
  sh.onclick=e=>{if(e.target===sh)sh.remove()};
  sh.appendChild(panel);document.body.appendChild(sh);
 };
 const swipe=(b,d)=>{
  let sx=0,sy=0,dx=0,t0=null;
  b.addEventListener("touchstart",e=>{const p=e.touches[0];sx=p.clientX;sy=p.clientY;dx=0;t0=setTimeout(()=>{t0=null;openMenu(d)},500)},{passive:true});
  b.addEventListener("touchmove",e=>{const p=e.touches[0],dy=p.clientY-sy;dx=p.clientX-sx;
   if(Math.abs(dx)>8||Math.abs(dy)>8)clearTimeout(t0);
   if(dx>0&&dx>Math.abs(dy)*1.5)b.style.transform="translateX("+Math.min(dx,70)+"px)"},{passive:true});
  b.addEventListener("touchend",()=>{clearTimeout(t0);b.style.transform="";if(dx>60&&!d.data().deleted&&status!=="ended")startReply(d);dx=0},{passive:true});
  b.addEventListener("touchcancel",()=>{clearTimeout(t0);b.style.transform=""},{passive:true});
  b.addEventListener("contextmenu",e=>{e.preventDefault();openMenu(d)});
 };
 const draw=docs=>{
  box.innerHTML="";let care=false;
  box.appendChild(el("div","m sys",isL?"A person is waiting to talk. Be kind, be present. You are a listener, not a therapist.":"You're chatting with a peer listener, a real person but not a therapist. Replies may take a little while."));
  if(!cur.id&&!isL)box.appendChild(el("div","m sys","Say whatever is on your mind. Your conversation begins when you send your first message."));
  if(cur.id&&status==="waiting"&&!isL)box.appendChild(el("div","m sys","Waiting for a listener. You can leave this page. Your conversation is saved in My Sessions."));
  docs.forEach(d=>{
   const x=d.data(),mine=x.senderId===me,b=el("div","m"+(mine?" me":""));
   if(x.deleted)b.appendChild(el("i",null,"This message was deleted"));
   else{
    if(x.replyTo)b.appendChild(el("div","qt",x.replyTo.text));
    b.appendChild(el("span",null,(x.flag&&isL?"⚠️ ":"")+x.text));
    if(x.edited)b.appendChild(el("small",null,"edited"));
    if(x.flag&&mine)care=true;
   }
   const mb=el("button","mb","⋯");mb.setAttribute("aria-label","Message options");mb.onclick=()=>openMenu(d);
   b.appendChild(mb);swipe(b,d);box.appendChild(b);
  });
  if(care&&!isL)box.appendChild(el("div","m sys care",CARE));
  box.scrollTop=box.scrollHeight;
 };
 const attach=()=>{
 listen(cref(),s=>{
  status=(s.data()||{}).status||"waiting";
  const ended=status==="ended";ta.disabled=sb.disabled=ended;endb.hidden=ended;
  foot.innerHTML="";
  if(ended){foot.append("This conversation has ended.");
   if(!isL){const rb=el("button","btn alt","Remove from My Sessions");rb.onclick=async()=>{try{await hideSession(cur.id);go("sessions")}catch(e){toast("Could not remove.")}};foot.append(el("br"),rb)}}
  draw(last);
 });
 listen(query(collection(db,"conversations",cur.id,"messages"),orderBy("createdAt")),s=>{last=s.docs;draw(last)});
 };
 if(cur.id)attach();else draw([]);
 const send=async()=>{
  const t=ta.value.trim();if(!t||sending)return;
  if(editing){
   const id=editing.id;ta.value="";editing=null;setBar();
   try{await updateDoc(mref(id),{text:t,edited:true,flag:RISK.test(t)})}catch(e){toast("Could not save the edit.")}
   return;
  }
  sending=true;ta.value="";const rp=reply;reply=null;setBar();
  try{
   if(!me){toast("Connecting… one moment.");await ready}
   if(!cur.id){
    const r=await addDoc(collection(db,"conversations"),{userId:me,mode:cur.mode,status:"waiting",createdAt:serverTimestamp(),lastMessageAt:serverTimestamp(),preview:t.slice(0,80),lastRole:"user"});
    cur.id=r.id;endb.hidden=false;attach();
   }
   const data={senderId:me,role:cur.role,text:t,flag:RISK.test(t),createdAt:serverTimestamp()};
   if(rp)data.replyTo=rp;
   await addDoc(collection(db,"conversations",cur.id,"messages"),data);
   const up={lastMessageAt:serverTimestamp(),preview:t.slice(0,80),lastRole:cur.role};
   if(isL&&status==="waiting")up.status="active";
   await updateDoc(cref(),up);
  }catch(e){ta.value=t;toast("Message not sent ("+(e.code||"error")+"). Please try again.")}
  sending=false;
 };
 sb.onclick=send;
 ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!coarse){e.preventDefault();send()}});
 endb.onclick=async()=>{if(confirm("End this conversation?"))try{await updateDoc(cref(),{status:"ended"})}catch(e){toast("Could not end it. Try again.")}};
 w.append(hd,sub,box,bar,f,foot);main.appendChild(w);
 if(!coarse)ta.focus({preventScroll:true});
}

async function hideSession(id){await updateDoc(doc(db,"conversations",id),{hiddenByUser:true})}
function list(q,role,emptyMsg){
 const holder=el("div");main.appendChild(holder);
 const rank={waiting:0,active:1,ended:2};
 listen(q,s=>{
  holder.innerHTML="";
  const rows=s.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.preview&&(role==="listener"||!c.hiddenByUser))
   .sort((a,b)=>(role==="listener"?(rank[a.status]??1)-(rank[b.status]??1):0)||(b.lastMessageAt?.seconds||0)-(a.lastMessageAt?.seconds||0));
  if(!rows.length){holder.appendChild(el("p","empty",emptyMsg));return}
  rows.forEach(c=>{
   const wr=el("div","rw"),r=el("button","row"),b=el("b",null,MODES[c.mode]?.name||"Conversation");
   b.appendChild(el("span","chip"+(c.status==="waiting"?" w":""),c.status));
   r.append(b,el("div","pv",c.preview||""),el("small",null,when(c.lastMessageAt)));
   r.onclick=()=>{cur={id:c.id,mode:c.mode,role,from:view};view="chat";render()};
   wr.appendChild(r);
   if(role==="user"&&c.status==="ended"){
    const x=el("button","rm","Remove");
    x.onclick=async()=>{if(confirm("Remove this session from your list?"))try{await hideSession(c.id)}catch(e){toast("Could not remove.")}};
    wr.appendChild(x);
   }
   holder.appendChild(wr);
  });
  if(role==="user"&&rows.some(c=>c.status==="ended")){
   const cl=el("button","btn alt","Clear all ended sessions");
   cl.onclick=async()=>{if(confirm("Remove all ended sessions from your list?"))try{await Promise.all(rows.filter(c=>c.status==="ended").map(c=>hideSession(c.id)))}catch(e){toast("Could not clear.")}};
   holder.appendChild(cl);
  }
 },e=>{holder.innerHTML="";holder.appendChild(el("p","empty","Could not load. Please check your connection."))});
}
function sessions(){
 main.innerHTML='<div class="hd"><h2>My Sessions</h2></div>';
 list(query(collection(db,"conversations"),where("userId","==",me)),"user","No sessions yet. Start one from Home whenever you're ready.");
 main.appendChild(el("p","note","Sessions are saved to this device's anonymous account. Clearing your browser data can remove access to them."));
}
let inboxTab="waiting",inboxMode="all";
function inbox(){
 main.innerHTML='<div class="hd"><h2>Listener Inbox</h2></div>';
 const tabs=el("div","tabs"),chips=el("div","chips"),holder=el("div");main.append(tabs,chips,holder);
 const T=c=>c.lastMessageAt?.seconds||Date.now()/1000;
 const NEED=c=>c.status!=="ended"&&c.lastRole==="user"?1:0;
 let all=[];
 const paint=()=>{
  const live=all.filter(c=>c.preview);
  const by={waiting:live.filter(c=>c.status==="waiting"),active:live.filter(c=>c.status==="active"),archive:live.filter(c=>c.status==="ended")};
  const inMode=c=>inboxMode==="all"||c.mode===inboxMode;
  tabs.innerHTML="";
  [["waiting","Waiting"],["active","Active"],["archive","Archive"]].forEach(([k,l])=>{
   const n=by[k].filter(inMode).length;
   const b=el("button","tab"+(inboxTab===k?" on":""),k==="archive"?l:l+" ("+n+")");
   b.onclick=()=>{inboxTab=k;paint()};tabs.appendChild(b);
  });
  chips.innerHTML="";
  [["all","All"],["talk","Need to Talk"],["listen","Just Listen"],["advice","Talk + Advice"]].forEach(([k,l])=>{
   const n=by[inboxTab].filter(c=>k==="all"||c.mode===k).length;
   const b=el("button","chip2 m-"+k+(inboxMode===k?" on":""),l+" "+n);
   b.onclick=()=>{inboxMode=k;paint()};chips.appendChild(b);
  });
  let rows=by[inboxTab].filter(inMode);
  rows.sort(inboxTab==="waiting"?(a,b)=>T(a)-T(b):(a,b)=>NEED(b)-NEED(a)||T(b)-T(a));
  if(inboxTab==="archive")rows=rows.slice(0,30);
  holder.innerHTML="";
  if(!rows.length){holder.appendChild(el("p","empty",inboxTab==="waiting"?"No one is waiting right now.":inboxTab==="active"?"No active conversations.":"Nothing in the archive."));return}
  rows.forEach(c=>{
   const r=el("button","row"),b=el("b",null,"");
   const pill=el("span","chip m-"+c.mode,MODES[c.mode]?.name||"Chat");pill.style.marginLeft="0";
   b.append(pill);
   if(NEED(c))b.append(el("span","need","● Needs reply"));
   r.append(b,el("div","pv",c.preview),el("small",null,when(c.lastMessageAt)));
   r.onclick=()=>{cur={id:c.id,mode:c.mode,role:"listener",from:"inbox"};view="chat";render()};
   holder.appendChild(r);
  });
 };
 listen(query(collection(db,"conversations"),orderBy("lastMessageAt","desc"),limit(200)),s=>{all=s.docs.map(d=>({id:d.id,...d.data()}));paint()},e=>{holder.innerHTML="";holder.appendChild(el("p","empty","Could not load. Please check your connection."))});
}
function resources(){
 main.innerHTML='<div class="hd"><h2>Resources</h2></div>';
 [["If you're in immediate danger","Contact your local emergency number right away. If you're having thoughts of harming yourself, reach a crisis line in your country or someone you trust."],
  ["Take a slow breath","Breathe in for 4 seconds, hold for 4, breathe out for 6. Repeat a few times."],
  ["Ground yourself","Name 5 things you can see, 4 you can feel, 3 you can hear."],
  ["About Safe Space","Our listeners are peers who listen with care. They are not therapists, and Safe Space is not medical care."]
 ].forEach(([h,p])=>{const c=el("div","card");c.append(el("h3",null,h),el("p",null,p));main.appendChild(c)});
}
function profile(){
 main.innerHTML='<div class="hd"><h2>Profile</h2></div>';
 const c=el("div","card");
 if(isListener){
  c.innerHTML="<h3>Listener account</h3><p>You are signed in as a listener.</p>";
  const o=el("button","btn alt","Sign out");o.onclick=async()=>{isListener=false;view="home";await signOut(auth)};c.appendChild(o);
 }else{
  c.innerHTML='<h3>Listener sign in</h3><p>For Safe Space listeners only.</p><br><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password">';
  const b=el("button","btn","Sign in"),r=el("button","btn alt","Forgot password");
  b.onclick=async()=>{
   try{await signInWithEmailAndPassword(auth,$("#em").value.trim(),$("#pw").value);
    if(!(await checkListener())){toast("This account is not set up as a listener.");await signOut(auth);return}
    view="inbox";render();
   }catch(e){toast("Sign in failed. Check your details.")}
  };
  r.onclick=async()=>{const e=$("#em").value.trim();if(!e)return toast("Type your email first.");try{await sendPasswordResetEmail(auth,e);toast("If that account exists, a reset email was sent.")}catch(x){toast("Could not send reset email.")}};
  c.append(b," ",r);
 }
 main.appendChild(c);
}
addEventListener("popstate",()=>{if(view==="chat"){view=(cur&&cur.from)||"home";render()}});
render();
</script>
